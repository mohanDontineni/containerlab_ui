name: firewall-policy-reference
topology:
  nodes:
    client:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      binds: ["client-frr.conf:/etc/frr/frr.conf"]
    firewall:
      kind: linux
      image: containerlab-studio/firewall:0.1.0
      binds: ["firewall/firewall.sh:/etc/studio/firewall.sh:ro"]
    server:
      kind: linux
      image: quay.io/frrouting/frr:10.4.1
      binds: ["server-frr.conf:/etc/frr/frr.conf"]
  links:
    - endpoints: ["client:eth1", "firewall:eth1"]
    - endpoints: ["firewall:eth2", "server:eth1"]
