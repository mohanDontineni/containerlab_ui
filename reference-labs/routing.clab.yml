name: routing-reference
topology:
  nodes:
    router1: {kind: linux, image: quay.io/frrouting/frr:10.4.1}
    router2: {kind: linux, image: quay.io/frrouting/frr:10.4.1}
    client1: {kind: linux, image: alpine:3.22}
    client2: {kind: linux, image: alpine:3.22}
  links:
    - endpoints: ["client1:eth1", "router1:eth1"]
    - endpoints: ["router1:eth2", "router2:eth2"]
    - endpoints: ["router2:eth1", "client2:eth1"]

