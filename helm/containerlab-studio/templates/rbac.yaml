apiVersion: v1
kind: ServiceAccount
metadata: {name: containerlab-studio-web}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: containerlab-studio-reconciler}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: containerlab-studio-reconciler}
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get","list","watch","create"]
- apiGroups: ["c9s.run"]
  resources: ["topologies","nodes","links","launcherprofiles","configs","imagerequests"]
  verbs: ["get","list","watch","create","patch","delete"]
- apiGroups: [""]
  resources: ["pods","pods/log","events","services"]
  verbs: ["get","list","watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["delete"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["get","create"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get","list","watch","create","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: containerlab-studio-reconciler}
subjects: [{kind: ServiceAccount, name: containerlab-studio-reconciler, namespace: {{ .Release.Namespace }}}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: containerlab-studio-reconciler}
