apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: containerlab-studio-postgres}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.storage.postgres }}}}
  {{- if .Values.storageClass }}
  storageClassName: {{ .Values.storageClass }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: containerlab-studio-redis}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.storage.redis }}}}
  {{- if .Values.storageClass }}
  storageClassName: {{ .Values.storageClass }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: containerlab-studio-artifacts}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.storage.artifacts }}}}
  {{- if .Values.storageClass }}
  storageClassName: {{ .Values.storageClass }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: containerlab-studio-registry}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.storage.registry }}}}
  {{- if .Values.storageClass }}
  storageClassName: {{ .Values.storageClass }}
  {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: containerlab-studio-registry}
spec:
  serviceName: containerlab-studio-registry
  replicas: 1
  selector: {matchLabels: {app: containerlab-studio-registry}}
  template:
    metadata: {labels: {app: containerlab-studio-registry}}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: registry
        image: {{ .Values.registry.image }}
        env:
        - {name: REGISTRY_HTTP_ADDR, value: "0.0.0.0:5000"}
        - {name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY, value: /var/lib/registry}
        - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "false"}
        ports: [{name: registry,containerPort: 5000}]
        volumeMounts: [{name: data,mountPath: /var/lib/registry}]
        readinessProbe: {httpGet: {path: /v2/,port: registry},initialDelaySeconds: 3,periodSeconds: 5}
        livenessProbe: {httpGet: {path: /v2/,port: registry},initialDelaySeconds: 15,periodSeconds: 15}
        resources: {requests: {cpu: 50m,memory: 128Mi},limits: {cpu: "1",memory: 1Gi}}
        securityContext: {allowPrivilegeEscalation: false,capabilities: {drop: [ALL]}}
      volumes: [{name: data,persistentVolumeClaim: {claimName: containerlab-studio-registry}}]
---
apiVersion: v1
kind: Service
metadata: {name: containerlab-studio-registry}
spec: {selector: {app: containerlab-studio-registry},ports: [{name: registry,port: 5000,targetPort: registry}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: containerlab-studio-registry}
spec:
  podSelector: {matchLabels: {app: containerlab-studio-registry}}
  policyTypes: [Ingress]
  ingress:
  - from: [{podSelector: {}}]
    ports: [{protocol: TCP,port: 5000}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: containerlab-studio-postgres}
spec:
  serviceName: containerlab-studio-postgres
  replicas: 1
  selector: {matchLabels: {app: containerlab-studio-postgres}}
  template:
    metadata: {labels: {app: containerlab-studio-postgres}}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 999}
      containers:
      - name: postgres
        image: {{ .Values.postgres.image }}
        env: [{name: POSTGRES_DB, value: containerlab},{name: POSTGRES_USER, value: containerlab},{name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: containerlab-studio-secrets,key: postgres-password}}}]
        ports: [{containerPort: 5432}]
        volumeMounts: [{name: data,mountPath: /var/lib/postgresql/data}]
        readinessProbe: {exec: {command: [pg_isready,-U,containerlab]}, initialDelaySeconds: 5, periodSeconds: 5}
      volumes: [{name: data,persistentVolumeClaim: {claimName: containerlab-studio-postgres}}]
---
apiVersion: v1
kind: Service
metadata: {name: containerlab-studio-postgres}
spec: {selector: {app: containerlab-studio-postgres}, ports: [{port: 5432}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: containerlab-studio-redis}
spec:
  serviceName: containerlab-studio-redis
  replicas: 1
  selector: {matchLabels: {app: containerlab-studio-redis}}
  template:
    metadata: {labels: {app: containerlab-studio-redis}}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 999}
      containers: [{name: redis,image: {{ .Values.redis.image }},args: ["redis-server","--appendonly","yes"],ports: [{containerPort: 6379}],volumeMounts: [{name: data,mountPath: /data}],readinessProbe: {exec: {command: ["redis-cli","ping"]},initialDelaySeconds: 3,periodSeconds: 5}}]
      volumes: [{name: data,persistentVolumeClaim: {claimName: containerlab-studio-redis}}]
---
apiVersion: v1
kind: Service
metadata: {name: containerlab-studio-redis}
spec: {selector: {app: containerlab-studio-redis}, ports: [{port: 6379}]}
