apiVersion: v1
kind: ConfigMap
metadata: {name: containerlab-studio-gateway}
data:
  nginx.conf: |
{{ .Files.Get "files/nginx.conf" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: containerlab-studio-gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: containerlab-studio-gateway}}
  template:
    metadata: {labels: {app: containerlab-studio-gateway}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true,runAsUser: 101,runAsGroup: 101,seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: gateway
        image: {{ .Values.gateway.image }}
        command: [nginx,-c,/etc/nginx-custom/nginx.conf,-g,"daemon off;"]
        ports: [{containerPort: 8443}]
        securityContext: {allowPrivilegeEscalation: false,capabilities: {drop: [ALL]},readOnlyRootFilesystem: true}
        volumeMounts: [{name: config,mountPath: /etc/nginx-custom},{name: tls,mountPath: /tls,readOnly: true},{name: tmp,mountPath: /tmp},{name: cache,mountPath: /var/cache/nginx}]
        readinessProbe: {tcpSocket: {port: 8443},initialDelaySeconds: 3,periodSeconds: 5}
      volumes: [{name: config,configMap: {name: containerlab-studio-gateway}},{name: tls,secret: {secretName: {{ .Values.gateway.tlsSecret }}}},{name: tmp,emptyDir: {}},{name: cache,emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: containerlab-studio-gateway}
spec:
  type: NodePort
  selector: {app: containerlab-studio-gateway}
  ports: [{name: https,port: 443,targetPort: 8443,nodePort: 30444}]

