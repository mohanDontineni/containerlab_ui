worker_processes auto; pid /tmp/nginx.pid; error_log /dev/stderr info;
events { worker_connections 1024; }
http { client_max_body_size 0; proxy_request_buffering off; access_log /dev/stdout;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream web { server containerlab-studio-web:8000; }
  server { listen 8443 ssl; server_name _; ssl_certificate /tls/tls.crt; ssl_certificate_key /tls/tls.key; ssl_protocols TLSv1.2 TLSv1.3;
    location / { proxy_pass http://web; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /ws/ { proxy_pass http://web; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; proxy_read_timeout 3600s; }
  }
}

